[workspace]
members = [
  "crates/switchboard-core",
  "crates/switchboard-app",
  "crates/switchboard-cef-sys",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Switchboard Contributors"]

[workspace.dependencies]
rusqlite = { version = "0.32", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
